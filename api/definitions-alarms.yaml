# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/go-c8y-cli/v2/tools/schema/extensionCommands.json
---
$schema: https://raw.githubusercontent.com/reubenmiller/go-c8y-cli/v2/tools/schema/extensionCommands.json
group:
  name: alarmdefinitions
  description: Manage Alarm Definitions
commands:
  - name: list
    description: Retrieve Alarm Definitions.
    method: GET
    path: service/dtm/definitions/alarms
    descriptionLong: |
      Retrieves all Alarm Definitions registered in your tenant.

      The query parameter supports a flexible syntax for filtering and ordering results.
    queryParameters:
      - name: query
        type: string
        description: Use the $filter keyword to specify filtering criteria.
        required: false
      - name: identifiers
        type: string[]
        description: Comma-separated list of Alarm Definition identifiers to filter by.
        required: false
      - name: titles
        type: string[]
        description: Comma-separated list of Alarm Definition titles to filter by.
        required: false
      - name: tags
        type: string[]
        description: Comma-separated list of tags to filter by.
        required: false
      - name: currentPage
        type: integer
        description: currentPage query parameter
        required: false
      - name: pageSize
        type: integer
        description: pageSize query parameter
        required: false
  - name: create
    description: Create a new Alarm Definition.
    method: POST
    path: service/dtm/definitions/alarms
    descriptionLong: |
      Creates a new Alarm Definition.

      An Alarm Definition requires a unique identifier and a JSON Schema (Draft-7) describing
      the alarm structure. An optional title can be provided.
  - name: update
    description: Update an existing Alarm Definition.
    method: PUT
    path: service/dtm/definitions/alarms
    descriptionLong: |
      Updates an existing Alarm Definition identified by the identifier in the request body.

      The JSON schema, title, and description of the definition can be updated.
